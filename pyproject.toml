[project]
name = "talo"
version = "0.0.1"
description = "Local decision and execution service for coding harnesses"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ashot Gasparyan" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
talo = "talo.cli:main"
talo-mcp = "talo.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
